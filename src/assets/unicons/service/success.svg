<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <mask id="circle-gap">
      <!-- Base white canvas preserves the circle -->
      <rect x="0" y="0" width="24" height="24" fill="white" />
      <!-- Thicker black stroke creates the gap under the checkmark -->
      <path d="M9 12.5l3.5 3L20 4.5" stroke="black" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>

  <!-- Circle with gap mask applied -->
  <circle cx="12" cy="12" r="8.5" mask="url(#circle-gap)" />

  <!-- Extended checkmark -->
  <path d="M8 11.5l3.5 3.5L21 3.5" />
</svg>
